version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jenovate-backend
    restart: always
    environment:
      - PORT=5001
      - NODE_ENV=production
      - JWT_SECRET=jenovate-secret-key-2026
      - FRONTEND_URL=http://localhost:8080
      - DB_STORAGE=/app/data/database.sqlite
    volumes:
      - sqlite-data:/app/data
      - uploads-data:/app/uploads
    ports:
      - "5001:5001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jenovate-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  sqlite-data:
  uploads-data:
